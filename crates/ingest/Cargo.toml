[package]
name = "hub-ingest"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# A repo's books are linted in parallel.
rayon.workspace = true
hub-manifest.workspace = true
hub-repo-read.workspace = true
hub-synthetic.workspace = true
hub-checks.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
flate2 = "1"
tracing = "0.1"
# Production reads Forgejo's MariaDB, read-only. Off by default: development
# reads the dump in dev-data/sql instead.
mysql = { version = "28", default-features = false, features = ["minimal-rust"], optional = true }

[features]
mariadb = ["dep:mysql"]
