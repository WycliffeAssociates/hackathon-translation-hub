[package]
name = "hub-store"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
hub-ingest.workspace = true
hub-checks.workspace = true
hub-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"
# Bundled: the server image needs no system SQLite, and STRICT tables need 3.37+.
rusqlite = { version = "0.40", features = ["bundled"] }
# The read models are the API's response bodies, so they carry their schema.
utoipa = "5"
