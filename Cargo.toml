# The hub's Rust side. Each crate owns one job; `hub-scan` runs them together.
#   manifest   tS / RC / Burrito manifests → one normalized shape
#   repo-read  bare repos on disk, read-only: HEAD, tree, blobs
#   stitch     Writer (tS) chunks → one USFM book, Sefer's template
#   synthetic  a Writer repo served as an RC-shaped repo
#   checks     scripture-kitchen lint summary, legacy markers, content key, coverage
#   domain     the Bible shape's rules (the Official pick)
#   ingest     the pipeline for one repo, and what Forgejo's DB says about repos
#   store      the hub's SQLite: migrations, writes from ingest, reads for the API
#   proof      sous-chef proofreading over one repo's books
#   biel       the public data API: language facts, catalog status
#   server     the HTTP API (/v1), the soft poll, logs and traces
#   hub-scan   CLI: run the pipeline over a repo root, write JSON (or the store)
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
git2 = { version = "0.20", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1"
# scripture-kitchen by tag, never by path. v0.1.10: the engine fills `{aux}` in
# a diagnostic's message itself (Sefer's editor-v0.1.0 expects it).
usfm_onion = { git = "https://github.com/WycliffeAssociates/scripture-kitchen", tag = "v0.1.10" }
mise = { git = "https://github.com/WycliffeAssociates/scripture-kitchen", tag = "v0.1.10" }

hub-manifest = { path = "crates/manifest" }
hub-repo-read = { path = "crates/repo-read" }
hub-stitch = { path = "crates/stitch" }
hub-synthetic = { path = "crates/synthetic" }
hub-checks = { path = "crates/checks" }
hub-domain = { path = "crates/domain" }
hub-ingest = { path = "crates/ingest" }
hub-store = { path = "crates/store" }
hub-biel = { path = "crates/biel" }
hub-proof = { path = "crates/proof" }
hub-history = { path = "crates/history" }
hub-markdown = { path = "crates/markdown" }
