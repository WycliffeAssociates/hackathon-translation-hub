# The hub on dev-data, as the coworker would run it locally:
#   docker compose up --build      → http://localhost:8787
# Production differs only in the repo mount (Forgejo's repository root) and
# HUB_FORGEJO_DB instead of the dump.
services:
  hub:
    build: .
    ports: ["8787:8787"]
    volumes:
      - ./dev-data/repositories:/repos:ro
      - ./dev-data/sql:/forgejo:ro
      - hub-data:/data
      - hub-logs:/logs
    environment:
      HUB_FORGEJO_DUMP: /forgejo/repository.sql.gz
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318   # optional: export spans
volumes:
  hub-data:
  hub-logs:
