<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>USFM Viewer Spike</title>
  </head>
  <body>
    <header class="bar">
      <label>Book
        <select id="book">
          <option value="19-PSA">Psalms (266 KB)</option>
          <option value="08-RUT">Ruth (14 KB)</option>
          <option value="08-RUT-broken">Ruth, with injected errors</option>
        </select>
      </label>
      <div class="seg" role="group" aria-label="Mode">
        <button id="mode-regular" aria-pressed="true">Regular</button>
        <button id="mode-usfm" aria-pressed="false">USFM</button>
      </div>
      <label>Chapter <select id="chapter"><option value="">Whole book</option></select></label>
      <label><input type="checkbox" id="clip" checked /> clip to chapter</label>
      <span id="stats" class="stats"></span>
    </header>
    <main id="pane"></main>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
